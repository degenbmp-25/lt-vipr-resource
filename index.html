<!doctype html>
<html lang="en">

  <style>
    :root{--ink:#313131;--ink-strong:#141414;--ivory:#fbf7f2;--ivory-2:#f2ede6;--line:#d8d1c3;--blue:#3a6daf;--blue-dark:#315d95;--sky:#3aa6ef;--navy:#151f2e;--muted:#707070;--serif:ui-serif,"New York","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    *{box-sizing:border-box}html,body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--sans)}html{scroll-behavior:smooth}body{min-height:100vh;background:radial-gradient(900px 460px at 92% -6%,rgba(58,166,239,.16),transparent 60%),linear-gradient(180deg,#fff 0,var(--ivory) 24rem,var(--ivory) 100%);-webkit-font-smoothing:antialiased}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit}.c{width:min(100% - 32px,940px);margin:auto}.hero{padding:max(54px,env(safe-area-inset-top)) 0 36px}.ey{font-size:11px;font-weight:700;letter-spacing:.19em;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:10px}.ey:before{content:"";width:22px;height:1px;background:currentColor;display:block}h1,h2,.wc h3,.rule h3,.ex h3,.mh h2{font-family:var(--serif);font-weight:400;color:var(--ink-strong)}h1{font-size:clamp(52px,10vw,88px);line-height:.93;letter-spacing:-.045em;margin:18px 0 12px;max-width:760px}.sub,p{color:var(--muted);line-height:1.5}.sub{font-size:18px;margin:0}.section-title{margin:42px 0 14px}.section-title h2{font-size:38px;letter-spacing:-.035em;margin:8px 0 0}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 16px}.rule,.ex{background:rgba(255,255,255,.78);border:1px solid rgba(216,209,195,.9);border-radius:4px;padding:20px;box-shadow:0 16px 40px rgba(49,49,49,.045)}.rule>span,.ph>span{font-size:10px;font-weight:700;letter-spacing:.08em;background:var(--ivory-2);color:var(--blue-dark);padding:7px 9px;border-radius:999px}.rule h3{margin:30px 0 7px;font-size:25px;line-height:1.03;letter-spacing:-.025em}.rule p{margin:0;font-size:14px}.head{display:flex;justify-content:space-between;align-items:end;margin:52px 0 16px}.head h2{margin:6px 0 0;font-size:36px;letter-spacing:-.035em}.head p{margin:0;font-size:14px}.workouts{display:grid;grid-template-columns:1fr 1fr;gap:14px}.wc{border:0;text-align:left;background:var(--navy);color:#fff;border-radius:4px;padding:28px;min-height:230px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(21,31,46,.14);transition:transform .18s ease,box-shadow .18s ease;display:flex;flex-direction:column;align-items:flex-start}.wc:nth-child(2){background:linear-gradient(145deg,var(--blue-dark),var(--blue))}.wc:hover{transform:translateY(-2px);box-shadow:0 24px 60px rgba(21,31,46,.18)}.wc:after{content:"";position:absolute;width:210px;height:210px;border:1px solid rgba(255,255,255,.28);border-radius:50%;right:-78px;bottom:-118px;box-shadow:0 0 0 34px rgba(255,255,255,.045);pointer-events:none}.wc small{color:rgba(255,255,255,.68);font-size:10px;font-weight:700;letter-spacing:.17em;position:relative;z-index:1}.wc h3{color:#fff;font-size:39px;margin:46px 0 9px;letter-spacing:-.035em;position:relative;z-index:1}.wc p{color:rgba(255,255,255,.67);margin:0 0 24px;max-width:80%;position:relative;z-index:1}.wc>b{margin-top:auto;width:100%;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;letter-spacing:.02em;position:relative;z-index:1}.wc i{font-style:normal;border:1px solid rgba(255,255,255,.55);color:#fff;width:36px;height:36px;display:grid;place-items:center;border-radius:50%}.abbr{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0 54px}.abbr span{border:1px solid var(--line);background:rgba(255,255,255,.45);border-radius:999px;padding:10px 13px;color:var(--muted);font-size:13px}.abbr b{color:var(--ink)}.top{position:sticky;top:0;z-index:10;background:rgba(251,247,242,.92);backdrop-filter:blur(18px);border-bottom:1px solid rgba(216,209,195,.9);padding-top:env(safe-area-inset-top)}.bar{height:68px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.bar>div{text-align:center;font-size:13px}.bar>div b{font-family:var(--serif);font-size:16px;font-weight:500}.bar small{display:block;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-top:2px}.bar button{border:1px solid var(--line);background:#fff;border-radius:999px;height:40px;padding:0 14px;font-weight:600;font-size:13px}.bar #share{justify-self:end;background:var(--ink);border-color:var(--ink);color:#fff}.wh{padding:38px 0 10px}.wh h1{font-size:clamp(48px,9vw,72px);margin-bottom:8px}.wh p{margin:0}.tabs{position:sticky;top:82px;z-index:8;display:grid;grid-template-columns:1fr 1fr;background:var(--ivory-2);border:1px solid var(--line);border-radius:999px;padding:5px;margin:20px 0 34px;box-shadow:0 8px 24px rgba(49,49,49,.04)}.tabs button{border:0;background:none;border-radius:999px;padding:13px;font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--muted)}.tabs .on{background:var(--ink);color:#fff}.phase{margin:0 0 34px}.ph{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:0 0 12px;margin:0 0 11px}.ph h2{font-size:24px;margin:0;letter-spacing:-.025em}.list{display:grid;gap:10px}.et{display:flex;gap:12px;align-items:center}.et i{font-style:normal;width:31px;height:31px;border-radius:50%;border:1px solid var(--line);background:var(--ivory-2);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--blue-dark)}.ex h3{font-size:23px;margin:0;letter-spacing:-.025em}.met{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 14px 43px}.met>div{border:1px solid var(--line);background:var(--ivory);border-radius:3px;padding:10px 12px;min-width:100px}.met small{display:block;color:var(--muted);text-transform:uppercase;font-size:9px;font-weight:700;letter-spacing:.11em;margin-bottom:5px}.met b{font-weight:600;color:var(--ink)}.video{margin-left:43px;width:calc(100% - 43px);border:1px solid var(--ink);background:var(--ink);color:#fff;padding:13px 15px;border-radius:999px;font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.video>b{color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:50%;width:27px;height:27px;display:grid;place-items:center;font-size:9px}footer{color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding:22px 0 calc(42px + env(safe-area-inset-bottom))}.modal{position:fixed;inset:0;background:rgba(10,10,10,.8);backdrop-filter:blur(10px);display:grid;place-items:center;padding:18px;z-index:50}.sheet{background:var(--ivory);border-radius:8px;width:min(100%,900px);max-height:94vh;overflow:hidden;box-shadow:0 30px 100px rgba(0,0,0,.42);display:flex;flex-direction:column}.mh{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 20px;background:var(--ivory)}.mh h2{margin:4px 0 0;font-size:29px;line-height:1.05}.x{width:42px;height:42px;flex:0 0 42px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:22px;cursor:pointer}.frame{aspect-ratio:16/9;background:#090909;overflow:hidden;position:relative}.frame iframe,.frame video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}.frame video{object-fit:contain}.player-actions{display:grid;grid-template-columns:1fr 1fr;gap:8p";padding:12px 14px 14px;background:var(--ivory)}.fs,.drive,.done{border:1px solid var(--line);border-radius:999px;padding:13px 15px;text-align:center;font-weight:650;font-size:13px;text-decoration:none;cursor:pointer}.fs{background:var(--ink);border-color:var(--ink);color:#fff}.drive{background:#fff;color:var(--ink)}.done{grid-column:1/-1;background:transparent;color:var(--muted);padding:9px}.hint{font-size:11px;line-height:1.4;margin:0;padding:0 16px 10px;color:var(--muted);background:var(--ivory)}
    @media(max-width:650px){.c{width:min(100% - 24px,720px)}.hero{padding-top:max(38px,env(safe-area-inset-top))}h1{font-size:54px}.sub{font-size:16px}.section-title h2{font-size:33px}.rules,.workouts{grid-template-columns:1fr}.rule{padding:18px}.rule h3{margin-top:20px}.head{align-items:start;flex-direction:column;margin-top:44px}.head h2{font-size:32px}.wc{min-height:215px;padding:24px}.wc h3{font-size:36px;margin-top:42px}.wc p{max-width:84%;margin-bottom:20px}.wh{padding-top:28px}.wh h1{font-size:49px}.ph h2{font-size:22px}.ex{padding:17px}.ex h3{font-size:22px}.met{margin-left:0}.video{margin-left:0;width:100%}.modal{padding:max(16px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom));display:grid;place-items:center;background:rgba(10,10,10,.88);backdrop-filter:blur(8px)}.sheet{width:min(100%,720px);height:auto;max-height:calc(100dvh - max(32px,env(safe-area-inset-top)) - max(32px,env(safe-area-inset-bottom)));border-radius:16px;background:#080808;box-shadow:0 24px 80px rgba(0,0,0,.5);overflow:hidden}.mh{height:auto;min-height:66px;padding:12px 14px;background:#080808;color:#fff;flex:0 0 auto}.mh .ey{color:#b7c9d6;font-size:9px}.mh h2{color:#fff;font-family:var(--sans);font-size:16px;font-weight:600;letter-spacing:-.01em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72vw}.x{background:#1d1d1d;border-color:#444;color:#fff}.frame{flex:0 0 auto;min-height:0;aspect-ratio:16/9;width:100%;margin:0;background:#000}.frame iframe,.frame video{width:100%;height:100%}.frame video{object-fit:contain}.hint{display:none}.player-actions{flex:0 0 auto;grid-template-columns:1fr 1fr;padding:10px 12px 12px;background:#080808;border-top:1px solid #262626}.fs,.drive{min-height:46px;display:grid;place-items:center}.fs{background:#fff;border-color:#fff;color:#111}.drive{background:#1d1d1d;border-color:#3b3b3b;color:#fff}.done{display:block}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const DATA={title:'ViPR Training Resource',subtitle:'Weeks 1–2 · Workshop Reference',rules:[['01','Long, strong spine','“Kite” position'],['02','Initiate with the hips','Lead the movement from the hips'],['03','Reach with the scapula','“Your ViPR, not mine”']],abbr:[['HK','Half kneeling'],['TK','Tall kneeling'],['W/O','Workout']],phases:[['movement','01','Movement Prep'],['skill','02','Skill-Building / Elasticity'],['strength','03','Strength'],['metabolic','04','Metabolic / Recovery']],videos:{'HK tilt reach.mov':'1UyJAEq3OX-__4hygSjp78-B_WvjRCzPg','Standing hinge tilt.mov':'1RuZxDWHTU9H6KpsnYu3LMWwKsFJ9Tkfu','Front grip T spine rotation.mov':'1uTPlIxsao7FeKrk79i0U8DMkBzSdgxoh','ViPR Halo.mov':'1c2DP5nnDb5o-6kfY2HYV29mGCxDmUSZw','Squat w forward shift.mov':'1qbx4lsGewy78vzI76YqHZXrFUpx_suaw','Halo & punch.mov':'1tIDEmW4I9lbbITRvcBoqGAXhA_X3HJhH','Fast feet fw/bw tilt.mov':'1zcK9W1llUe3m5ToV9DNahWcNStaYM6iN','Thread needle squat.mov':'1p1icRZcCaoCL3AHnJgFDTScOLEeFv33Q','Split stance lateral tilt.mov':'1kIV2-wQTFUcU8oa2juIa7jJXiX2NjyJL','SL balance & reach reach.mov':'10GsfXfOqirMWLMWSejxfrIaGwy4tMzl6','cylinder lunge.mov':'1a41YUue1T8cPBSpk77P0pArfn9Jl0IRR','Lateral shuffle tilt.mov':'1396OYjzxBMdnbK73jMGWXtDrlIdpDnss','ViPR skater.mov':'1EuK1075KN296ahQ_Vn_eiML704plYVmr'},workouts:[{id:1,title:'Workout 01',ex:[['movement','I','HK Tilt & Reach','HK tilt reach.mov','2x10','8kg+','2x10','8kg+'],['movement','II','Standing Hinge Tilt','Standing hinge tilt.mov','1x12','10kg+','1x12','10kg+'],['skill','I','Front Grip T-Spine Rotations','Front grip T spine rotation.mov','2x10','Any','2x12','Any'],['skill','II','ViPR Halo','ViPR Halo.mov','2x10','<12kg','2x12','<12kg'],['strength','I','Squat to Forward Shift','Squat w forward shift.mov','2x10','<12kg','2x12','<12kg'],['strength','II','Halo & Punch','Halo & punch.mov','2x10','<12kg','2x12','<12kg'],['metabolic','I','Fast Feet Fwd/Bwd Tilt','Fast feet fw/bw tilt.mov','2x10','>10kg','2x10','>10kg'],['metabolic','II','Thread the Needle Squats','Thread needle squat.mov','2x10','<12kg','2x12','<12kg']]},{id:2,title:'Workout 02',ex:[['movement','I','HK Tilt & Reach','HK tilt reach.mov','2x10','8kg+','2x10','8kg+'],['movement','II','Split Stance Lateral Tilt','Split stance lateral tilt.mov','1x12','Any','1x12','Any'],['skill','I','Front Grip T-Spine Rotations','Front grip T spine rotation.mov','2x10','Any','2x10','Any'],['skill','II','SL Balance & Reach','SL balance & reach reach.mov','2x10','<12kg','2x12','<12kg'],['strength','I','Squat to Forward Shift','Squat w forward shift.mov','2x8','W/O #1 +2kg','2x8','wk1 W/O #1 +4kg'],['strength','II','Cylinder Lunge','cylinder lunge.mov','2x10','Any','2x12','Any'],['metabolic','I','Lateral Shuffle Tilt','Lateral shuffle tilt.mov','2x10','Any','2x10','Any'],['metabolic','II','Skater','ViPR skater.mov','2x10','<12kg','2x12','<12kg']]}]};
    const A=document.querySelector('#app');let S={w:null,k:1};
    const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
    function home(){S.w=null;scrollTo(0,0);A.innerHTML=`<main class="c hero"><div class="ey">Workshop companion</div><h1>${DATA.title}</h1><p class="sub">${DATA.subtitle}</p><div class="section-title"><div class="ey">Principles</div><h2>3 Rules of the ViPR</h2></div><section class="rules">${DATA.rules.map(r=>`<article class="rule"><span>${r[0]}</span><h3>${r[1]}</h3><p>${r[2]}</p></article>`).join('')}</section><div class="head"><div><div class="ey">Programming</div><h2>Choose a workout</h2></div><p>2 weeks · 4 phases · 8 exercises each</p></div><section class="workouts">${DATA.workouts.map(w=>`<button class="wc" data-w="${w.id}"><small>WEEKS 1–2</small><h3>${w.title}</h3><p>Eight exercises across four training phases.</p><b><span>Open workout</span><i>→</i></b></button>`).join('')}</section><div class="head"><div><div class="ey">Reference</div><h2>Abbreviations</h2></div></div><div class="abbr">${DATA.abbr.map(x=>`<span><b>${x[0]}</b> = ${x[1]}</span>`).join('')}</div></main>`;document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>openW(+b.dataset.w))}
    function openW(id){S.w=id;render();scrollTo(0,0)}
    function render(){const w=DATA.workouts.find(x=>x.id===S.w),a=S.k===1?4:6,b=a+1;A.innerHTML=`<header class="top"><div class="c bar"><button id="back" aria-label="Back to workouts">←</button><div><b>${w.title}</b><small>Week ${S.k}</small></div><button id="share">Share</button></div></header><main class="c"><section class="wh"><div class="ey">Training session</div><h1>${w.title}</h1><p>Eight exercises across four training phases.</p></section><nav class="tabs" aria-label="Select week"><button data-k="1" class="${S.k===1?'on':''}">WEEK 1</button><button data-k="2" class="${S.k===2?'on':''}">WEEK 2</button></nav>${DATA.phases.map(p=>`<section class="phase"><div class="ph"><span>${p[1]}</span><h2>${p[2]}</h2></div><div class="list">${w.ex.filter(e=>e[0]===p[0]).map(e=>`<article class="ex"><div class="et"><i>${e[1]}</i><h3>${e[2]}</h3></div><div class="met"><div><small>Sets / Reps</small><b>${esc(e[a])}</b></div><div><small>Load / Time</small><b>${esc(e[b])}</b></div></div><button class="video" data-f="${esc(e[3])}" data-n="${esc(e[2])}"><span>Watch demonstration</span><b>▶</b></button></article>`).join('')}</div></section>`).join('')}<footer>Workshop reference · ViPR Weeks 1–2 · Videos play inline</footer></main>`;document.querySelector('#back').onclick=home;document.querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>{S.k=+x.dataset.k;render()});document.querySelectorAll('.video').forEach(x=>x.onclick=()=>video(x.dataset.f,x.dataset.n));document.querySelector('#share').onclick=shareResource}
    function video(file,name){const id=DATA.videos[file],m=document.createElement('div');m.className='modal';const stream=`/api/video?id=${encodeURIComponent(id)}`,drive=`https://drive.google.com/file/d/${id}/view`;m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(name)} video"><div class="mh"><div><div class="ey">Exercise demonstration</div><h2>${esc(name)}</h2></div><button class="x" aria-label="Close video">×</button></div><div class="frame"><video src="${stream}" title="${esc(name)} demonstration" controls playsinline webkit-playsinline preload="metadata"></video></div><p class="hint">Use the native video controls for playback, full screen, and picture in picture. Google Drive remains available as a fallback.</p><div class="player-actions"><button class="fs" type="button">Full screen</button><a class="drive" target="_blank" rel="noopener" href="${drive}">Open in Drive</a><button class="done" type="button">Close</button></div></div>`;document.body.append(m);document.body.style.overflow='hidden';const frame=m.querySelector('.frame'),player=m.querySelector('video');const close=()=>{try{player.pause()}catch(e){}player.removeAttribute('src');player.load();m.remove();document.body.style.overflow=''};m.querySelector('.x').onclick=close;m.querySelector('.done').onclick=close;m.onclick=e=>{if(e.target===m)close()};m.querySelector('.fs').onclick=async()=>{try{if(player.webkitEnterFullscreen)player.webkitEnterFullscreen();else if(player.requestFullscreen)await player.requestFullscreen();else if(frame.requestFullscreen)await frame.requestFullscreen();else window.open(drive,'_blank','noopener')}catch(e){window.open(drive,'_blank','noopener')}}}
        async function shareResource(){try{navigator.share?await navigator.share({title:DATA.title,text:'ViPR Weeks 1–2 workshop training resource',url:location.href}):await navigator.clipboard.writeText(location.href)}catch(e){}}
    if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));home();
  </script>
</body>
</html>
